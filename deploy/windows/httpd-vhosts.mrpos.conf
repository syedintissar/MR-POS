# Add this to C:\xampp\apache\conf\extra\httpd-vhosts.conf (or include it), then restart Apache.
# Make sure these lines are active in C:\xampp\apache\conf\httpd.conf:
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule headers_module modules/mod_headers.so
#   Include conf/extra/httpd-vhosts.conf
#
# Replace 192.168.1.10 with the Server PC's fixed IP address.

<VirtualHost *:80>
    ServerName mrpos.local
    ServerAlias 192.168.1.10
    DocumentRoot "D:/MR-POS/public"

    <Directory "D:/MR-POS/public">
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth: nothing under storage (backups, uploads, logs) is ever served directly.
    <Directory "D:/MR-POS/storage">
        Require all denied
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
