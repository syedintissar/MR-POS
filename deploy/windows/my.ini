; MariaDB 11.4 for MR-POS. Copy to C:\mariadb-11.4\my.ini
; Port 3308 and localhost only: nothing on the network can reach the database, only this PC.
[mysqld]
basedir=C:/mariadb-11.4
datadir=C:/mariadb-11.4/data
port=3308
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-time-zone='+05:00'
innodb_flush_log_at_trx_commit=1
sql_mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
max_allowed_packet=64M
log_error=C:/mariadb-11.4/data/mariadb-error.log
[client]
port=3308
default-character-set=utf8mb4
