
# ---- MR-POS (single PC, program in C:\MR-POS, opened as http://mr-pos.local) ----
# Appended to C:\xampp\apache\conf\extra\httpd-vhosts.conf by docs/CLIENT_LAPTOP_SETUP.md
<VirtualHost *:80>
    ServerName mr-pos.local
    DocumentRoot "C:/MR-POS/public"

    <Directory "C:/MR-POS/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth: nothing under storage (uploads, logs) is ever served directly.
    <Directory "C:/MR-POS/storage">
        Require all denied
    </Directory>

    ErrorLog "logs/mr-pos-error.log"
    CustomLog "logs/mr-pos-access.log" common
</VirtualHost>
